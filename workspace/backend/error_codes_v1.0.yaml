# pxiu 错误码定义 v1.0 （后端 FastAPI 脚手架）
# 产出者：zhenhai（后端工程师） 日期：2026-09-03
# 前置：workspace/architecture/api_contract_v1.yaml（API 契约）
# 说明：本脚手架暂以占位服务返回 mock，尚未接入真实图像处理（OCR/inpaint/render）。
#       本表预登记契约约定的通用错误码与后续能力接入时将出现的错误信号。
#       契约 ErrorResponse 结构：{ success:false, error:{ code, message, details? } }

codes:
  # ---- 通用请求错误 ----
  - id: PXIU_VALIDATION_001
    severity: HIGH
    module: main / routers (FastAPI 校验)
    symptom: "缺少必填字段（如 /api/ocr 无 file）或字段类型/枚举不合法"
    behavior: FastAPI 返回 422；HTTP 层面校验失败
    status: OPEN

  - id: PXIU_BAD_REQUEST_400
    severity: HIGH
    module: routers
    symptom: "请求参数语义错误（bbox/bboxes JSON 解析失败、坐标格式错误）"
    behavior: 返回 400 + ErrorResponse（code=INVALID_REQUEST）
    status: OPEN

  # ---- 图片格式 ----
  - id: PXIU_INVALID_IMAGE_FORMAT
    severity: HIGH
    module: services (ocr/inpaint/render)
    symptom: "上传文件非 PNG/JPEG/WebP 或解码失败"
    behavior: 返回 400 + ErrorResponse（code=INVALID_IMAGE_FORMAT）
    status: OPEN

  - id: PXIU_EMPTY_IMAGE
    severity: HIGH
    module: services
    symptom: "图片尺寸为 0 或内容为空"
    behavior: 返回 400 + ErrorResponse（code=EMPTY_IMAGE）
    status: OPEN

  # ---- OCR 相关 ----
  - id: PXIU_OCR_FAILED
    severity: HIGH
    module: ocr_service
    symptom: "PaddleOCR 初始化或推理阶段异常"
    behavior: 返回 500 + ErrorResponse（code=PROCESSING_FAILED / OCR_FAILED）
    status: OPEN   # 脚手架占位，待接入

  # ---- 背景修复 ----
  - id: PXIU_INPAINT_FAILED
    severity: HIGH
    module: inpaint_service
    symptom: "OpenCV inpaint 失败或 bboxes 越界"
    behavior: 返回 500 + ErrorResponse（code=PROCESSING_FAILED）
    status: OPEN   # 脚手架占位，待接入

  # ---- 文字渲染 ----
  - id: PXIU_RENDER_FAILED
    severity: HIGH
    module: render_service
    symptom: "Pillow 渲染失败、字体缺失或 base64 解码失败"
    behavior: 返回 500 + ErrorResponse（code=PROCESSING_FAILED / RENDER_FAILED）
    status: OPEN   # 脚手架占位，待接入

  - id: PXIU_FONT_NOT_FOUND
    severity: MEDIUM
    module: render_service
    symptom: "指定 font_name/font_family 在本地不可用"
    behavior: 回退默认字体并记录，或返回 400（FONT_NOT_FOUND）
    status: OPEN

  # ---- 导出 ----
  - id: PXIU_EXPORT_FAILED
    severity: HIGH
    module: render_service (export)
    symptom: "导出格式转换失败、base64 非法"
    behavior: 返回 400/500 + ErrorResponse（code=EXPORT_FAILED）
    status: OPEN

  # ---- 服务器内部 ----
  - id: PXIU_INTERNAL_500
    severity: HIGH
    module: main
    symptom: "未捕获异常"
    behavior: 返回 500 + ErrorResponse（code=PROCESSING_FAILED）
    status: OPEN
