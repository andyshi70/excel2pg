# pxiu 错误码定义 v0.2
# 产出者：zhenhai（后端工程师） 日期：2026-08-30
# 说明：本单机 Swift 项目无 HTTP API；本表登记 v0.3 变更暴露的"可观测失败信号"。
#       v0.1 的 5 条 PXIU_TEST_001~005 均已由 v0.2 实现修复闭环 → status 已关闭。
#       新增：WorkflowError 扩展（analyzeStyles）+ CI 挂起（工具链级）登记。

codes:
  # ---- v0.1 已闭环条目（状态更新） ----
  - id: PXIU_TEST_001
    severity: BLOCKER
    module: FontMatcherTests / EstimationTests (共享 TestSupport 渲染)
    symptom: "Fatal error: Double value cannot be converted to UInt8"
    status: CLOSED   # v0.2 修复：采样坐标 clamp + UInt8 边界量化

  - id: PXIU_TEST_002
    severity: HIGH
    module: SelfInpainter (U6)
    symptom: InpainterTests 3 用例 SSIM 远低于门禁
    status: CLOSED   # v0.2 修复：双 buffer + SOR + 掩码量化

  - id: PXIU_TEST_003
    severity: HIGH
    module: CollisionDetector (U11)
    symptom: 夹具自相矛盾（excluding/id 缺失）
    status: CLOSED   # v0.2 修复：夹具修正，正文算法本就正确

  - id: PXIU_TEST_004
    severity: MEDIUM
    module: FitCalculator (U7)
    symptom: testFitShrinkToTarget ink 误差 2.38 > 1%
    status: CLOSED   # v0.2 修复：夹具文本过重，改 "Hell" 语义正确

  - id: PXIU_TEST_005
    severity: MEDIUM
    module: EditorDocument 状态机 (U8)
    symptom: notext 添加块未直达 selected
    status: CLOSED   # v0.2 修复：.idle/.noText → .selected 转移补齐

  # ---- v0.3 新增 ----
  - id: PXIU_WORKFLOW_001
    severity: HIGH
    module: EditingWorkflow.analyzeStyles（新增入口）
    symptom: 整批样式分析全部失败
    error_type: WorkflowError.styleAnalysisFailed([UUID: String])
    contract: 仅当 analyzed.isEmpty && !failed.isEmpty 时抛出；failed 携带逐块原因；
              幂等可重试（重跑仅处理 style==nil 的块）。单块失败不中断、不抛错，
              该块保持 style=nil（UI 禁重绘并提示）。
    action: UI 捕获后按 failed 逐块提示用户；可重试整批或单块
    status: CLOSED   # 已实现 + 5 条 TDD 测试全绿

  - id: PXIU_WORKFLOW_002
    severity: MEDIUM
    module: EditingWorkflow.analyzeStyles
    symptom: document.sourceImage 缺失（无源图不可分析样式）
    error_type: WorkflowError.noSourceImage（复用既有错误）
    action: UI 入口前置判断，无源图禁用“分析样式”按钮
    status: CLOSED

  - id: PXIU_CI_001
    severity: BLOCKER
    module: swift test（debug/-Onone，工具链级故障）
    symptom: 全部用例 PASS 后进程不退出；单测试确定性挂起（EstimationTests.testU3SizeRecovery
             经 FontMatcher.match → ImagePixels.rgba → Array.subscript.modify / CG 内部原语自旋，
             单核 98–100%，ASan 静默，-enforce-exclusivity=none 仍挂）
    root_cause: Swift 6.3.2 (swiftlang-6.3.2.1.108, CommandLineTools, arm64-apple-macosx26.0)
                -Onone 代码生成下的工具链级故障；同输入同链路 -O 下 4.2s 通过
    workaround: CI 采用 `swift test -c release`（49/49 pass, exit 0 已验证）
                或升级/固定工具链版本（zongguan 决策）
    status: OPEN_WORKAROUND   # 根治待工具链修复或版本固定，业务代码不可修复