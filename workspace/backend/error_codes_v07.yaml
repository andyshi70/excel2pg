# pxiu 错误码定义 v07 （字形像素复用交付）
# 产出者：zhenhai（后端工程师） 日期：2026-09-03
# 前置：workspace/architecture/tech_spec_glyph_reuse_2026-09-02.md（v1.3）+ decisions D-042
# 说明：本单机 Swift 项目无 HTTP API；本表登记 glyph 拼贴路径暴露的"可观测失败信号"。
#       v07 为纯渲染内部改造，不新增错误码——沿用既有 RenderError/WorkflowError 类型；
#       glyph 路径的兜底语义（非致命）与既有错误映射一并登记如下。

codes:
  # ---- glyph 渲染路径：非致命兜底信号（不抛错，走回退） ----
  - id: PXIU_GLYPH_FALLBACK_001
    severity: INFO
    module: GlyphAtlas.build / GlyphCompositor.shouldUseGlyph
    symptom: "池未构建或无逐字框（OCR 全程无 perCharBoxes）→ isBuilt=false"
    behavior: 整体回退 TextRenderer（零回归），不抛错
    status: OPEN   # 设计使然（D8 豁免路径）

  - id: PXIU_GLYPH_FALLBACK_002
    severity: INFO
    module: GlyphCompositor.shouldUseGlyph
    symptom: "编辑目标文本含 CJK 或块 matchStatus == exact → 决策 false"
    behavior: 整体回退 TextRenderer（零回归，§5.2）
    status: OPEN   # 设计使然（保守回退）

  - id: PXIU_GLYPH_FALLBACK_003
    severity: INFO
    module: GlyphCompositor.shouldUseGlyph / render
    symptom: "池外字符占比 >50% 或遇池外字符 → 逐字 TextRenderer 兜底混排"
    behavior: 池外 ≤50% 逐字混排；>50% 整体回退
    status: OPEN   # 设计使然（D7）

  - id: PXIU_GLYPH_FALLBACK_004
    severity: INFO
    module: GlyphAtlas.build
    symptom: "池内存超 8MB 护栏（maxPoolBytes）→ truncated=true，丢弃后续 crop"
    behavior: 保留已加入条目；缺图字形走 nearest → fallback
    status: OPEN   # 护栏设计（§3.3 / §6）

  # ---- glyph 渲染路径：致命错误映射（沿用既有 RenderError/WorkflowError） ----
  - id: PXIU_GLYPH_ERROR_001
    severity: HIGH
    module: GlyphCompositor.render / EditingWorkflow.process
    symptom: "RenderError.textTooLong（编辑文本超出块适配宽度）"
    mapping: WorkflowError.textTooLong → UI 提示文字过长
    status: OPEN   # 与 TextRenderer 路径一致的既有映射

  - id: PXIU_GLYPH_ERROR_002
    severity: HIGH
    module: GlyphCompositor.render / EditingWorkflow.process
    symptom: "RenderError.collision（拼贴后 inkRect 与邻块重叠 >2px）"
    mapping: WorkflowError.renderFailed / 碰撞拦截 → UI 阻塞提示
    status: OPEN   # 与 TextRenderer 路径一致的既有映射

  - id: PXIU_GLYPH_ERROR_003
    severity: HIGH
    module: GlyphCompositor.render
    symptom: "RenderError.engineFailure（空文本 / 空 patch 尺寸 / 无逐字框且无 fallback）"
    mapping: WorkflowError.renderFailed
    status: OPEN   # 兜底引擎级错误