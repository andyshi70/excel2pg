# pxiu 错误码定义 v0.1
# 产出者：zhenhai（后端工程师） 日期：2026-08-28
# 说明：本单机 Swift 项目无 HTTP API；本表登记迁移后测试暴露的"可观测失败信号"，
#       供 dana 产品缺陷归档与 zongguan 裁决。命名沿用 tech_spec 的 U# 映射。

codes:
  - id: PXIU_TEST_001
    severity: BLOCKER
    module: FontMatcherTests / EstimationTests (共享 TestSupport 渲染)
    symptom: "Fatal error: Double value cannot be converted to UInt8 (UInt8.max / UInt8.min)"
    root_cause_hypothesis: 测试渲染辅助 / 像素写入 UInt8(c*255) 遇到越界通道值（AA/合成产生 >1 或 <0）
    action: 修复共享渲染代码越界保护；修复后两套件方可完整运行
    status: OPEN

  - id: PXIU_TEST_002
    severity: HIGH
    module: SelfInpainter (U6)
    symptom: InpainterTests 3 用例 SSIM ≈ 0.02~0.05，远低于门禁 0.85~0.95
    root_cause_hypothesis: inpaint 算法未达 PRD 无痕门禁（product defect）
    action: 待 dana 评审 / zongguan 裁决后修正 PxiuCore 算法
    status: OPEN

  - id: PXIU_TEST_003
    severity: HIGH
    module: CollisionDetector (U11)
    symptom: testExcludingSelf 未排除自身（overlapPx 1500）；testOverlapDetected 命中非预期 blockID
    root_cause_hypothesis: excluding 参数未生效 / 命中块引用逻辑错误（product defect）
    action: 待裁决修正
    status: OPEN

  - id: PXIU_TEST_004
    severity: MEDIUM
    module: FitCalculator (U7)
    symptom: testFitShrinkToTarget ink 误差 2.38 > 1%；tooLong 误报
    root_cause_hypothesis: 宽度适配精度/过长判定偏差（product defect）
    action: 待裁决修正
    status: OPEN

  - id: PXIU_TEST_005
    severity: MEDIUM
    module: EditorDocument 状态机 (U8)
    symptom: notext 添加块未直达 selected（Issue recorded）
    root_cause_hypothesis: notext→selected 转移未达标（product defect）
    action: 待裁决修正
    status: OPEN
