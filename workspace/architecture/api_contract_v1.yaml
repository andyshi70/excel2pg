openapi: 3.0.3
info:
  title: Pxiu 图片文字编辑 API
  description: |
    Tauri Desktop App（React + TypeScript 前端）与 FastAPI（Python 后端）之间的 REST API。
    功能流程：图片导入 → OCR 识别 → 样式分析 → 文字编辑 → 背景修复 → 文字渲染 → 导出
  version: 1.0.0
  contact:
    name: Pxiu Team
  license:
    name: MIT

servers:
  - url: http://localhost:8765
    description: 本地开发服务器

tags:
  - name: ocr
    description: OCR 文字识别
  - name: style
    description: 样式分析
  - name: inpaint
    description: 背景修复
  - name: render
    description: 文字渲染
  - name: export
    description: 图片导出

paths:
  /api/ocr:
    post:
      tags:
        - ocr
      operationId: recognizeText
      summary: OCR 文字识别
      description: |
        对输入图片进行 OCR 识别，返回识别到的文字列表及其位置、置信度、旋转角度。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 待识别的图片文件（支持 PNG, JPEG, WebP）
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 识别成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/analyze-style:
    post:
      tags:
        - style
      operationId: analyzeTextStyle
      summary: 文字样式分析
      description: |
        分析指定区域内的文字样式，包括主色、字号、字重、对齐方式、旋转角度和候选字体。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StyleAnalysisRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 分析成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/inpaint:
    post:
      tags:
        - inpaint
      operationId: inpaintImage
      summary: 背景修复
      description: |
        清除指定区域的文字并修复背景，返回修复后的图片（base64 编码）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InpaintRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 修复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpaintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/render-text:
    post:
      tags:
        - render
      operationId: renderText
      summary: 文字渲染
      description: |
        在图片指定区域渲染新文字，返回渲染后的图片（base64 编码）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderTextRequest'
      responses:
        '200':
          description: 渲染成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderTextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/export:
    post:
      tags:
        - export
      operationId: exportImage
      summary: 图片导出
      description: |
        将最终图片导出为指定格式（PNG/JPEG/WebP）并返回二进制文件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: 导出成功
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    # ==================== OCR 相关 ====================
    BoundingBox:
      type: array
      description: 边界框坐标 [x1, y1, x2, y2]（像素）
      items:
        type: number
        format: float
      minItems: 4
      maxItems: 4
      example: [10.5, 20.3, 150.8, 45.2]

    OCRItem:
      type: object
      description: 单个 OCR 识别结果
      required:
        - text
        - bbox
        - confidence
        - angle
      properties:
        text:
          type: string
          description: 识别到的文字
          example: "Hello World"
        bbox:
          $ref: '#/components/schemas/BoundingBox'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 置信度 0-1
          example: 0.95
        angle:
          type: number
          format: float
          description: 旋转角度（度），正值为顺时针
          example: -2.5

    OCRResponse:
      type: object
      description: OCR 识别响应
      required:
        - success
        - items
      properties:
        success:
          type: boolean
          description: 是否成功
          example: true
        items:
          type: array
          description: 识别到的文字列表
          items:
            $ref: '#/components/schemas/OCRItem'
        width:
          type: integer
          description: 图片宽度（像素）
          example: 1920
        height:
          type: integer
          description: 图片高度（像素）
          example: 1080

    # ==================== 样式分析相关 ====================
    RGBColor:
      type: object
      description: RGB 颜色值
      required:
        - r
        - g
        - b
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
          example: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
          example: 0
        b:
          type: integer
          minimum: 0
          maximum: 255
          example: 0

    FontCandidate:
      type: object
      description: 字体候选
      required:
        - name
        - similarity
      properties:
        name:
          type: string
          description: 字体名称
          example: "Arial Bold"
        similarity:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 相似度 0-1
          example: 0.89

    StyleAnalysisRequest:
      type: object
      description: 样式分析请求
      required:
        - file
        - bbox
      properties:
        file:
          type: string
          format: binary
          description: 待分析的图片文件
        bbox:
          $ref: '#/components/schemas/BoundingBox'

    StyleAnalysisResponse:
      type: object
      description: 样式分析响应
      required:
        - success
        - dominant_color
        - font_size_px
        - font_weight
        - alignment
        - rotation_angle
        - font_candidates
      properties:
        success:
          type: boolean
          description: 是否成功
          example: true
        dominant_color:
          $ref: '#/components/schemas/RGBColor'
        font_size_px:
          type: number
          format: float
          description: 字号（像素）
          example: 24.5
        font_weight:
          type: string
          enum:
            - thin
            - regular
            - bold
          description: 字重
          example: "bold"
        alignment:
          type: string
          enum:
            - left
            - center
            - right
          description: 对齐方式
          example: "center"
        rotation_angle:
          type: number
          format: float
          description: 旋转角度（度）
          example: 0.0
        font_candidates:
          type: array
          description: Top-3 候选字体
          items:
            $ref: '#/components/schemas/FontCandidate'
          minItems: 0
          maxItems: 3

    # ==================== 背景修复相关 ====================
    InpaintRequest:
      type: object
      description: 背景修复请求
      required:
        - file
        - bboxes
      properties:
        file:
          type: string
          format: binary
          description: 待修复的图片文件
        bboxes:
          type: array
          description: 需要清除文字的区域列表
          items:
            $ref: '#/components/schemas/BoundingBox'
          minItems: 1

    InpaintResponse:
      type: object
      description: 背景修复响应
      required:
        - success
        - image_base64
      properties:
        success:
          type: boolean
          description: 是否成功
          example: true
        image_base64:
          type: string
          description: 修复后的图片（base64 编码）
          example: "data:image/png;base64,iVBORw0KGgo..."

    # ==================== 文字渲染相关 ====================
    TextStyle:
      type: object
      description: 文字样式
      required:
        - font_name
        - font_size_px
        - color
        - font_weight
        - alignment
      properties:
        font_name:
          type: string
          description: 字体名称
          example: "Arial"
        font_size_px:
          type: number
          format: float
          description: 字号（像素）
          example: 24.0
        color:
          $ref: '#/components/schemas/RGBColor'
        font_weight:
          type: string
          enum:
            - thin
            - regular
            - bold
          description: 字重
          example: "regular"
        alignment:
          type: string
          enum:
            - left
            - center
            - right
          description: 对齐方式
          example: "center"

    RenderTextRequest:
      type: object
      description: 文字渲染请求
      required:
        - image_base64
        - text
        - bbox
        - style
      properties:
        image_base64:
          type: string
          description: 原图（base64 编码）
          example: "data:image/png;base64,iVBORw0KGgo..."
        text:
          type: string
          description: 新文字内容
          example: "Hello World"
        bbox:
          $ref: '#/components/schemas/BoundingBox'
        style:
          $ref: '#/components/schemas/TextStyle'

    RenderTextResponse:
      type: object
      description: 文字渲染响应
      required:
        - success
        - image_base64
      properties:
        success:
          type: boolean
          description: 是否成功
          example: true
        image_base64:
          type: string
          description: 渲染后的图片（base64 编码）
          example: "data:image/png;base64,iVBORw0KGgo..."

    # ==================== 导出相关 ====================
    ExportFormat:
      type: string
      enum:
        - png
        - jpeg
        - webp
      description: 导出格式
      example: "png"

    ExportRequest:
      type: object
      description: 导出请求
      required:
        - image_base64
        - format
      properties:
        image_base64:
          type: string
          description: 最终图片（base64 编码）
          example: "data:image/png;base64,iVBORw0KGgo..."
        format:
          $ref: '#/components/schemas/ExportFormat'
        quality:
          type: integer
          minimum: 1
          maximum: 100
          description: 质量（仅 jpeg/webp 有效）
          example: 85

    # ==================== 通用错误 ====================
    ErrorResponse:
      type: object
      description: 错误响应
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: 始终为 false
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 错误码
              example: "INVALID_IMAGE_FORMAT"
            message:
              type: string
              description: 错误描述
              example: "不支持的图片格式，请使用 PNG、JPEG 或 WebP"
            details:
              type: object
              description: 额外错误信息（可选）
              additionalProperties: true

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "INVALID_REQUEST"
              message: "请求参数无效"
              details:
                field: "bbox"
                reason: "坐标格式错误，需要 [x1, y1, x2, y2]"

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: "PROCESSING_FAILED"
              message: "图片处理失败，请稍后重试"

  # ==================== 安全方案 ====================
  securitySchemes:
    LocalAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 本地 API 密钥（可选，用于保护本地服务）

# 全局安全（可选）
# security:
#   - LocalAuth: []
